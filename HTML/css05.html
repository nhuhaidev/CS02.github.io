<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bài 5 - Trang xem phim</title>
<link rel="stylesheet" href="../CSS/css05.css">
</head>
<body>

  <header class="topbar">
    <div class="logo">STREAMFLIX</div>
    <nav>
      <a href="#">Trang chủ</a>
      <a href="#">Phim</a>
      <a href="#">Thể loại</a>
    </nav>
  </header>

  <main>
    <h1 class="page-title">Phim nổi bật hôm nay</h1>

    <section class="row">
      <h2>Xu hướng</h2>
      <div class="poster-track">
        <div class="poster hue1">
          <span class="badge">HOT</span>
          <span class="poster-title">Drishyam 2</span>
        </div>
        <div class="poster hue2"><span class="poster-title">Encanto</span></div>
        <div class="poster hue3"><span class="poster-title">Wicked</span></div>
        <div class="poster hue4"><span class="poster-title">Jumanji</span></div>
        <div class="poster hue5"><span class="poster-title">Black Panther</span></div>
      </div>
    </section>

    <section class="row">
      <h2>Mới phát hành</h2>
      <div class="poster-track">
        <div class="poster hue6"><span class="poster-title">Scary Movie</span></div>
        <div class="poster hue7"><span class="poster-title">Sinners</span></div>
        <div class="poster hue8"><span class="poster-title">The Manager</span></div>
        <div class="poster hue9"><span class="poster-title">Us</span></div>
        <div class="poster hue10"><span class="poster-title">Wonka</span></div>
      </div>
    </section>
  </main>

</body>
</html>
